variables:
  DOCKER_REGISTRY: 852201627708.dkr.ecr.eu-west-1.amazonaws.com
  AWS_DEFAULT_REGION: eu-west-1
  REPO: velocity
  DOCKER_DRIVER: overlay2
  AWS_CLI_IMAGE: public.ecr.aws/aws-cli/aws-cli:2.24.18
  PREFIX: dev
  CLUSTER: dev
  K8s_PROXY_IP: 10.0.0.13


stages:
  - changelog
  - build
  - deploy

#================
# Update Changelog
#================
update-changelog:
  stage: changelog
  image: node:20-alpine
  before_script:
    - apk add --no-cache git
    - git config --global user.email "ci@velocity"
    - git config --global user.name "Velocity CI"
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - |
      LAST_CL=$(git log --follow -1 --format="%H" CHANGELOG.md 2>/dev/null || true)
      if [ -z "$LAST_CL" ]; then
        echo "No CHANGELOG.md history found, skipping"
        exit 0
      fi
      # Process each commit since the last changelog update, oldest first
      git log --format="%s" --reverse ${LAST_CL}..HEAD | while IFS= read -r msg; do
        printf '%s' "$msg" > /tmp/commit-msg
        node scripts/update-changelog.js /tmp/commit-msg CHANGELOG.md || true
      done
      # Push back only if CHANGELOG.md changed
      if git diff --quiet CHANGELOG.md; then
        echo "No changelog changes to commit"
      else
        git add CHANGELOG.md
        git commit -m "chore: update CHANGELOG.md [skip ci]"
        git push origin HEAD:${CI_COMMIT_BRANCH}
        echo "CHANGELOG.md updated and pushed"
      fi
  tags:
    - hetzner-docker
  only:
    - dev

#=========
# Build
#=========
build-to-aws:
  stage: build
  # Both jobs use the pushed commit; the changelog job publishes separately.
  # Start building immediately. Deployment still waits for both jobs to pass.
  needs: []
  image: docker:28.5.1-cli
  services:
    - name: docker:28.5.1-dind
      alias: docker
  before_script:
    - docker info
    - docker buildx version
  script:
    - sh .gitlab/build.sh
  tags:
    - hetzner-docker


#=======================
# Deploy-to-dev-hetzner
#=======================
deploy-to-dev-hetzner:
  stage: deploy
  # The official Docker CLI image already includes the OpenSSH client.
  # Deployment only invokes the existing remote update-service.sh script.
  image: docker:28.5.1-cli
  variables:
    GIT_STRATEGY: none
  before_script:
    - eval $(ssh-agent -s)
    - echo "$HETZ_DEV_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $K8s_PROXY_IP >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ssh apyuser@$K8s_PROXY_IP "/home/apyuser/bin/update-service.sh \"$REPO\" \"${PREFIX}-${CI_PIPELINE_ID}\" \"apytool-dev-velocity\""
    - echo "deployment successful in hetzner"
  tags:
    - hetzner-docker 
