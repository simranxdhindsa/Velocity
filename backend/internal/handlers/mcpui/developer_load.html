<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Velocity Developer Load</title>
<style>
  :root {
    --bg-surface: #0f172a;
    --bg-elevated: #111c34;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --border-color: rgba(148, 163, 184, 0.16);
    --color-primary: #6366f1;
    --color-success: #10b981;
    --color-warning: #f59e0b;
    --color-danger: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    color: var(--text-primary);
  }
  #root { padding: 4px; }
  .card {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    padding: 18px 20px;
  }
  .card-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-secondary);
  }
  .sprint {
    font-size: 12px;
    color: var(--text-muted);
  }
  .rows { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .login {
    width: 92px;
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-primary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .track {
    flex: 1;
    height: 10px;
    background: var(--bg-elevated);
    border-radius: 999px;
    overflow: hidden;
  }
  .bar {
    height: 100%;
    border-radius: 999px;
    transition: width 0.3s ease;
  }
  .bar-low { background: var(--color-success); }
  .bar-mid { background: var(--color-warning); }
  .bar-high { background: var(--color-danger); }
  .count {
    width: 22px;
    text-align: right;
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-secondary);
  }
  .empty {
    color: var(--text-muted);
    font-size: 13px;
    text-align: center;
    padding: 20px 0;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(6px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes rowIn {
    from { opacity: 0; transform: translateX(-4px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .card-anim { animation: cardIn 0.32s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .row-anim {
    opacity: 0;
    animation: rowIn 0.26s ease-out both;
  }
  .row-anim:nth-child(1) { animation-delay: 0.06s; }
  .row-anim:nth-child(2) { animation-delay: 0.11s; }
  .row-anim:nth-child(3) { animation-delay: 0.16s; }
  .row-anim:nth-child(4) { animation-delay: 0.21s; }
  .row-anim:nth-child(5) { animation-delay: 0.26s; }
  .row-anim:nth-child(6) { animation-delay: 0.31s; }
  .row-anim:nth-child(n+7) { animation-delay: 0.36s; }
</style>
</head>
<body>
<div id="root">
  <div class="card"><div class="empty">Waiting for load data…</div></div>
</div>
<script>
(function () {
  var hostOrigin = null;
  var initId = 1;

  function post(method, params, id) {
    var msg = { jsonrpc: "2.0", method: method, params: params || {} };
    if (id !== undefined) msg.id = id;
    parent.postMessage(msg, hostOrigin || "*");
  }

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }

  function barClass(count) {
    if (count >= 6) return "bar-high";
    if (count >= 3) return "bar-mid";
    return "bar-low";
  }

  function render(data) {
    if (!data || !data.load) return;
    var root = document.getElementById("root");
    var names = data.names || {};
    var entries = Object.keys(data.load).map(function (login) {
      return { login: login, count: data.load[login] };
    });
    entries.sort(function (a, b) { return b.count - a.count; });

    var max = 1;
    entries.forEach(function (e) { if (e.count > max) max = e.count; });

    var targetWidths = [];
    var rows = entries
      .map(function (e, i) {
        var count = e.count < 0 ? 0 : e.count;
        var widthPct = Math.max(4, Math.round((count / max) * 100));
        targetWidths.push(widthPct);
        var label = names[e.login] || e.login;
        return (
          '<div class="row row-anim">' +
            '<div class="login" title="' + esc(label) + '">' + esc(label) + "</div>" +
            '<div class="track"><div class="bar ' + barClass(count) + '" data-i="' + i + '" style="width:0%"></div></div>' +
            '<div class="count">' + (e.count < 0 ? "?" : e.count) + "</div>" +
          "</div>"
        );
      })
      .join("");

    root.innerHTML =
      '<div class="card card-anim">' +
        '<div class="card-header">' +
          '<span class="title">Developer Load</span>' +
          '<span class="sprint">' + esc(data.sprint || "") + "</span>" +
        "</div>" +
        '<div class="rows">' + (rows || '<div class="empty">No developers</div>') + "</div>" +
      "</div>";

    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        var bars = root.querySelectorAll(".bar[data-i]");
        bars.forEach(function (bar) {
          var idx = Number(bar.getAttribute("data-i"));
          bar.style.width = targetWidths[idx] + "%";
        });
      });
    });
  }

  window.addEventListener("message", function (event) {
    var msg = event.data;
    if (!msg || typeof msg !== "object") return;
    if (!hostOrigin) hostOrigin = event.origin;

    if (msg.id === initId && msg.result) {
      post("ui/notifications/initialized");
      return;
    }
    if (msg.method === "ui/notifications/tool-result" && msg.params) {
      render(msg.params.structuredContent);
    }
  });

  post(
    "ui/initialize",
    {
      protocolVersion: "2026-01-26",
      capabilities: { appCapabilities: {} },
      clientInfo: { name: "velocity-developer-load", version: "1.0.0" },
    },
    initId
  );
})();
</script>
</body>
</html>
