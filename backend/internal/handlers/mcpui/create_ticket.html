<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Velocity Ticket</title>
<style>
  :root {
    --bg-surface: #0f172a;
    --bg-elevated: #111c34;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --border-color: rgba(148, 163, 184, 0.16);
    --color-primary: #6366f1;
    --color-primary-hover: #4f46e5;
    --color-success: #10b981;
    --color-success-muted: rgba(16, 185, 129, 0.12);
    --color-warning: #f59e0b;
    --color-warning-muted: rgba(245, 158, 11, 0.12);
    --color-danger: #ef4444;
    --color-danger-muted: rgba(239, 68, 68, 0.12);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    color: var(--text-primary);
  }
  #root { padding: 4px; }
  .card {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    padding: 18px 20px;
  }
  .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .issue-id {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--color-primary);
    background: rgba(99, 102, 241, 0.12);
    border-radius: 6px;
    padding: 3px 8px;
  }
  .status-label {
    font-size: 12px;
    color: var(--color-success);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--color-success);
  }
  .summary {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.4;
    margin: 0 0 14px 0;
  }
  .pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 16px;
  }
  .pill {
    font-size: 11px;
    font-weight: 600;
    padding: 4px 9px;
    border-radius: 999px;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .pill-neutral {
    background: var(--bg-elevated);
    color: var(--text-secondary);
    border-color: var(--border-color);
  }
  .pill-danger { background: var(--color-danger-muted); color: var(--color-danger); }
  .pill-warning { background: var(--color-warning-muted); color: var(--color-warning); }
  .pill-success { background: var(--color-success-muted); color: var(--color-success); }
  .pill-primary { background: rgba(99, 102, 241, 0.12); color: var(--color-primary); }
  .actions { display: flex; gap: 8px; }
  .btn-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    background: var(--color-primary);
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 8px;
    transition: background 0.15s ease;
  }
  .btn-link:hover { background: var(--color-primary-hover); }
  .empty {
    color: var(--text-muted);
    font-size: 13px;
    text-align: center;
    padding: 20px 0;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(6px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes pillIn {
    from { opacity: 0; transform: translateY(3px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card-anim { animation: cardIn 0.32s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .pill-anim {
    opacity: 0;
    animation: pillIn 0.28s ease-out both;
  }
  .pill-anim:nth-child(1) { animation-delay: 0.08s; }
  .pill-anim:nth-child(2) { animation-delay: 0.14s; }
  .pill-anim:nth-child(3) { animation-delay: 0.2s; }
  .pill-anim:nth-child(4) { animation-delay: 0.26s; }
</style>
</head>
<body>
<div id="root">
  <div class="card"><div class="empty">Waiting for ticket…</div></div>
</div>
<script>
(function () {
  var hostOrigin = null;
  var initId = 1;

  function post(method, params, id) {
    var msg = { jsonrpc: "2.0", method: method, params: params || {} };
    if (id !== undefined) msg.id = id;
    parent.postMessage(msg, hostOrigin || "*");
  }

  function priorityClass(priority) {
    if (!priority) return "pill-neutral";
    var p = priority.toLowerCase();
    if (p === "show-stopper" || p === "p0") return "pill-danger";
    if (p === "p1" || p === "a0" || p === "a1") return "pill-warning";
    if (p === "p2" || p === "a2") return "pill-primary";
    return "pill-success";
  }

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }

  function pill(text, cls) {
    if (!text) return "";
    return '<span class="pill pill-anim ' + cls + '">' + esc(text) + "</span>";
  }

  function render(data) {
    if (!data) return;
    var root = document.getElementById("root");
    var pills = [
      pill(data.type, "pill-neutral"),
      pill(data.priority, priorityClass(data.priority)),
      pill(data.subsystem, "pill-neutral"),
      pill(data.assignee ? "@" + data.assignee : "", "pill-neutral"),
    ].join("");

    root.innerHTML =
      '<div class="card card-anim">' +
        '<div class="card-header">' +
          '<span class="issue-id">' + esc(data.issue_id || "") + "</span>" +
          '<span class="status-label"><span class="status-dot"></span>Created</span>' +
        "</div>" +
        '<p class="summary">' + esc(data.summary || "") + "</p>" +
        '<div class="pills">' + pills + "</div>" +
        '<div class="actions">' +
          (data.url
            ? '<a class="btn-link" href="' + esc(data.url) + '" target="_blank" rel="noopener noreferrer">Open in YouTrack →</a>'
            : "") +
        "</div>" +
      "</div>";
    requestAnimationFrame(reportSize);
  }

  window.addEventListener("message", function (event) {
    var msg = event.data;
    if (!msg || typeof msg !== "object") return;
    if (!hostOrigin) hostOrigin = event.origin;

    if (String(msg.id) === String(initId) && msg.result) {
      post("ui/notifications/initialized");
      return;
    }
    if (msg.method === "ui/notifications/tool-result" && msg.params) {
      render(msg.params.structuredContent);
    }
  });

  function reportSize() {
    post("ui/notifications/size-changed", {
      width: document.body.scrollWidth,
      height: document.body.scrollHeight,
    });
  }
  if (typeof ResizeObserver !== "undefined") {
    new ResizeObserver(reportSize).observe(document.body);
  }
  window.addEventListener("load", reportSize);

  post(
    "ui/initialize",
    {
      protocolVersion: "2026-01-26",
      capabilities: { appCapabilities: {} },
      clientInfo: { name: "velocity-create-ticket", version: "1.0.0" },
    },
    initId
  );
})();
</script>
</body>
</html>
